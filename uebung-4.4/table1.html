<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="table1.css" />
    <title>Tabellen</title>
  </head>
  <body>
    <h1>Tabellen</h1>
    <p>1</p>
    <table border="1">
      <thead>
        <tr>
          <th>Album</th>
          <th>Jahr</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Rubber Soul</td>
          <td>1965</td>
        </tr>
        <tr>
          <td>Revolver</td>
          <td>1966</td>
        </tr>
        <tr>
          <td>Sgt. Pepper's</td>
          <td>1967</td>
        </tr>
        <tr>
          <td>Das Weisse Album</td>
          <td>1968</td>
        </tr>
        <tr>
          <td>Abbey Road</td>
          <td>1969</td>
        </tr>
      </tbody>
    </table>

    <p>2</p>

    <table border="1">
      <thead>
        <tr>
          <td colspan="3">Oh Brother Where Art Thou?</td>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Tatort</td>
          <td>Versteckte Kamera</td>
          <td>Is'was, Doc</td>
        </tr>
        <tr>
          <td>Bonanza</td>
          <td colspan="2">Rauchende Colts</td>
        </tr>
      </tbody>
    </table>

    <p>3</p>

    <table border="1">
      <tbody>
        <tr>
          <td>Äpfel</td>
          <td rowspan="3">Orangen</td>
          <td>Birnen</td>
        </tr>
        <tr>
          <td>Bananen</td>
          <td rowspan="2">Ananas</td>
        </tr>
        <tr>
          <td>Lychees</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
